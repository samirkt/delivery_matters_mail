<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Name Card Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 1rem;
      line-height: 1.4;
      font-size: 16px; /* good base size for mobile */
    }
  
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
    }
  
    p {
      margin-bottom: 1rem;
    }
  
    input[type="file"],
    button {
      display: block;
      width: 100%;
      max-width: 300px;
      margin: 0.5rem 0;
      padding: 0.75rem;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
  
    button {
      background-color: #007acc;
      color: white;
      border: none;
      cursor: pointer;
    }
  
    button:hover {
      background-color: #005ea0;
    }
  </style>
</head>
<body>
  <h1>Apartment Name Card Generator</h1>
  <p>To get started, click "Choose File" and select the file that you want to generate name cards from. The file must be a .csv file. Once you have selected a file, click "Generate PDF" and your PDF with name cards should be available in your downloads.</p>
  <br>
  <br>
  <input type="file" id="csvFile" accept=".csv" />
  <button onclick="generatePDF()">Generate PDF</button>

  <script>
    const inch = 72;
    const PAGE_W = 8.5 * inch, PAGE_H = 11 * inch;
    const CARD_W = 3.5 * inch, CARD_H = 2.0 * inch;
    const COLS = 2, ROWS = 5;
    const LM = 0.5 * inch, RM = 0.5 * inch, TM = 0.5 * inch, BM = 0.5 * inch;

    const total_cards_w = COLS * CARD_W;
    const total_cards_h = ROWS * CARD_H;
    const avail_w = PAGE_W - LM - RM;
    const avail_h = PAGE_H - TM - BM;
    const gutter_x = (avail_w - total_cards_w) / (COLS - 1);
    const gutter_y = (avail_h - total_cards_h) / (ROWS - 1);
    const GRID_LEFT = LM + Math.max(0, (avail_w - (total_cards_w + gutter_x*(COLS-1))) / 2);
    const GRID_TOP = PAGE_H - TM - Math.max(0, (avail_h - (total_cards_h + gutter_y*(ROWS-1))) / 2);

    function cardOrigin(col, row) {
      const x = GRID_LEFT + col * (CARD_W + gutter_x);
      const yTop = GRID_TOP - row * (CARD_H + gutter_y);
      return [x, yTop - CARD_H];
    }

    function extractApartmentNumber(unitStr) {
      if (!unitStr) return "";
      const parts = unitStr.split("-");
      if (parts.length >= 2) {
        const apt = parts[1];
        return apt.replace(/\D/g, ""); // digits only
      }
      return unitStr.trim();
    }

    function normalizeNameCase(name) {
      if (!name) return "";
      return name.split(" ").map(word => {
        if (word.includes("-")) {
          return word.split("-").map(p => p.charAt(0).toUpperCase()+p.slice(1).toLowerCase()).join("-");
        } else if (word.includes("'")) {
          return word.split("'").map(p => p.charAt(0).toUpperCase()+p.slice(1).toLowerCase()).join("'");
        } else {
          return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
        }
      }).join(" ");
    }

    function removeDupSuffix(name) {
      if (!name) return "";
      let s = String(name);
    
      // 1) remove all digits
      s = s.replace(/[0-9]/g, "");
    
      // 2) remove any trailing hyphen/apostrophe left by patterns like "-1" or "'2"
      s = s.replace(/\s*[-']\s*$/g, "");
    
      // 3) collapse extra spaces and trim
      s = s.replace(/\s{2,}/g, " ").trim();
    
      return s;
    }

    function normalizeHeaderName(name) {
      return name.toLowerCase().replace(/[^a-z]/g, "");
    }
    
    function findColumnMapping(headers) {
      const mapping = {};
      const normHeaders = headers.map(h => [h, normalizeHeaderName(h)]);
    
      function match(targets) {
        for (const [orig, norm] of normHeaders) {
          if (targets.some(t => norm.includes(t))) return orig;
        }
        return null;
      }
    
      mapping.address = match(["address", "street"]);
      mapping.unit = match(["unit", "apt", "apartment"]);
      mapping.firstname = match(["firstname", "first"]);
      mapping.lastname = match(["lastname", "last", "surname"]);
    
      return mapping;
    }


    async function generatePDF() {
      const file = document.getElementById("csvFile").files[0];
      if (!file) { alert("Upload a CSV first!"); return; }

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: async function(results) {
          const data = results.data;
          const headers = Object.keys(data[0]);
          const cols = findColumnMapping(headers);
          
          if (!cols.address || !cols.unit || !cols.firstname || !cols.lastname) {
            alert("Uh oh! CSV must have columns for address, unit, first name, last name (or similarly named).\n\nColumns can be in any order. Extra columns with other names are OK.");
            return;
          }

          // Group by (address, normalized unit)
          const groups = {};
          for (const row of data) {
            const addr = (row[cols.address] || "").trim();
            const aptNum = extractApartmentNumber(row[cols.unit] || "");
            const first = normalizeNameCase(removeDupSuffix(row[cols.firstname] || ""));
            const last = normalizeNameCase(removeDupSuffix(row[cols.lastname] || ""));
            if (!first && !last) continue;
          
            const name = last && first ? `${last}, ${first}` : (last || first);
            const key = `${addr}||${aptNum}`;
            if (!groups[key]) groups[key] = { addr, aptNum, names: new Set() };
            groups[key].names.add(name);
          }

          // Build cards
          let cards = Object.values(groups).map(g => {
            const sortedNames = Array.from(g.names).sort((a,b) => {
              const [lastA] = a.split(",");
              const [lastB] = b.split(",");
              return lastA.trim().toLowerCase().localeCompare(lastB.trim().toLowerCase()) || a.localeCompare(b);
            });
            return { addr: g.addr, aptNum: g.aptNum, names: sortedNames };
          });

          // Sort cards by address, then apt num
          cards.sort((a,b) => {
            const addrCmp = a.addr.toLowerCase().localeCompare(b.addr.toLowerCase());
            if (addrCmp !== 0) return addrCmp;
            const aNum = parseInt(a.aptNum) || Infinity;
            const bNum = parseInt(b.aptNum) || Infinity;
            if (aNum !== bNum) return aNum - bNum;
            return a.aptNum.localeCompare(b.aptNum);
          });

          const { PDFDocument, StandardFonts } = PDFLib;
          const pdfDoc = await PDFDocument.create();
          const helvetica = await pdfDoc.embedFont(StandardFonts.Helvetica);
          const helveticaBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

          let page = pdfDoc.addPage([PAGE_W, PAGE_H]);
          drawCutMarks(page);

          let col = 0, row = 0;
          for (const card of cards) {
            const [x, y] = cardOrigin(col, row);
            drawCard(page, helvetica, helveticaBold, x, y, card.addr, card.aptNum, card.names);
            col++;
            if (col >= COLS) {
              col = 0; row++;
              if (row >= ROWS) {
                page = pdfDoc.addPage([PAGE_W, PAGE_H]);
                drawCutMarks(page);
                row = 0;
              }
            }
          }

          const pdfBytes = await pdfDoc.save();
          download(pdfBytes, "name_cards.pdf", "application/pdf");
        }
      });
    }

    function drawCutMarks(page) {
      const CUT_MARK_LEN = 8, CUT_MARK_THK = 0.5;
      const gray = PDFLib.rgb(0.7,0.7,0.7);
      for (let i=0;i<=COLS;i++) {
        const x = GRID_LEFT + i * CARD_W + (i>0? (i-1)*gutter_x:0);
        page.drawLine({start:{x,y:BM-CUT_MARK_LEN},end:{x,y:PAGE_H-TM+CUT_MARK_LEN},color:gray,thickness:CUT_MARK_THK});
      }
      for (let j=0;j<=ROWS;j++) {
        const y = GRID_TOP - j*CARD_H - (j>0? (j-1)*gutter_y:0);
        page.drawLine({start:{x:LM-CUT_MARK_LEN,y},end:{x:PAGE_W-RM+CUT_MARK_LEN,y},color:gray,thickness:CUT_MARK_THK});
      }
    }

    function drawCard(page, fontSmall, fontBig, x, y, addr, unit, names) {
      const HEADER_SIZE = 8;
      const BODY_SIZE_DEFAULT = 24;
      const BODY_SIZE_MIN = 10;
      const LINE_SPACING = 1.15;
      const padding = 6;
    
      const innerX = x + padding;
      const innerY = y + padding;
      const innerW = CARD_W - 2 * padding;
      const innerH = CARD_H - 2 * padding;
    
      // --- Header ---
      let curY = y + CARD_H - padding - HEADER_SIZE;
      page.drawText(addr || "", {x: innerX, y: curY, size: HEADER_SIZE, font: fontSmall});
      if (addr) curY -= HEADER_SIZE * LINE_SPACING;
      if (unit) {
        page.drawText("Unit " + unit, {x: innerX, y: curY, size: HEADER_SIZE, font: fontSmall});
        curY -= HEADER_SIZE * LINE_SPACING;
      }
    
      // --- Names area ---
      const namesAreaTop = curY - 2;
      const namesAreaHeight = namesAreaTop - innerY;
      if (namesAreaHeight <= 0) return;
    
      // Fit font
      let chosenSize = BODY_SIZE_MIN, lineH = BODY_SIZE_MIN * LINE_SPACING;
      for (let size = BODY_SIZE_DEFAULT; size >= BODY_SIZE_MIN; size--) {
        const testLineH = size * LINE_SPACING;
        if (names.length * testLineH <= namesAreaHeight &&
            names.every(n => fontBig.widthOfTextAtSize(n, size) <= innerW)) {
          chosenSize = size;
          lineH = testLineH;
          break;
        }
      }
    
      // Draw names
      let drawY = namesAreaTop - (lineH - chosenSize) / 2;
      for (const n of names) {
        if (drawY - chosenSize < innerY) break;
        // truncate if too wide
        let text = n;
        while (fontBig.widthOfTextAtSize(text, chosenSize) > innerW && text.length > 2) {
          text = text.slice(0, -1);
        }
        page.drawText(text, {x: innerX, y: drawY - chosenSize, size: chosenSize, font: fontBig});
        drawY -= lineH;
      }
    }
 

    function download(data, filename, type) {
      const blob = new Blob([data], {type});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
